<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    Toolbar icon: the same notched "v" as the app favicon, scaled to ~74% so it
    keeps clear of the tile edge. Chrome draws extension icons small and close
    to other icons; edge-to-edge artwork reads as a smudge at 16px.
    The light halo survives on a dark toolbar; the gradient carries the brand.
  -->
  <defs>
    <linearGradient id="vg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#310B59"/>
      <stop offset="1" stop-color="#7427C6"/>
    </linearGradient>
  </defs>
  <g transform="translate(256 256) scale(0.611 -0.611) translate(-292.5 -263.5)">
    <path d="M181 0 8 527H187L287 126H304L406 527H577L403 0Z" fill="none" stroke="#EFF1F8" stroke-opacity="0.30" stroke-width="30" stroke-linejoin="round"/>
    <path d="M181 0 8 527H187L287 126H304L406 527H577L403 0Z" fill="url(#vg)"/>
  </g>
</svg>
